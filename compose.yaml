services:
  wordpress:
    image: wordpress:php8.3-apache
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${LOCAL_DB_NAME:-kapalsantai}
      WORDPRESS_DB_USER: ${LOCAL_DB_USER:-kapalsantai}
      WORDPRESS_DB_PASSWORD: ${LOCAL_DB_PASSWORD:-local_dev_password}
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${LOCAL_DB_NAME:-kapalsantai}
      MARIADB_USER: ${LOCAL_DB_USER:-kapalsantai}
      MARIADB_PASSWORD: ${LOCAL_DB_PASSWORD:-local_dev_password}
      MARIADB_ROOT_PASSWORD: ${LOCAL_DB_ROOT_PASSWORD:-local_root_password}
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  wordpress_data:
  database_data:
